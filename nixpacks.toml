[providers]
providers = ["php", "node"]

[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_mysql", "php82Extensions.mysqli", "nodejs_20"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build"
]

[phases.start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"