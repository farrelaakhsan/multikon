providers = ["php", "node"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = 'sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan storage:link || true && php artisan config:clear --quiet && php artisan serve --host=0.0.0.0 --port=$PORT"'
