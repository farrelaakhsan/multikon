providers = ["php", "node"]

[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "php83Extensions.pdo_mysql", "php83Extensions.mysqli", "php83Extensions.gd", "php83Extensions.mbstring", "php83Extensions.zip", "php83Extensions.bcmath", "php83Extensions.curl", "php83Extensions.xml", "php83Extensions.fileinfo"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = 'sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan storage:link || true && php artisan config:clear --quiet && php artisan serve --host=0.0.0.0 --port=$PORT"'
